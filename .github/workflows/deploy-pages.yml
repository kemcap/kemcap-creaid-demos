name: Deploy CreAid-Media Website Demos to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true
      - name: Upload site files
        uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
      - name: Verify published demo
        shell: bash
        run: |
          set -euo pipefail
          BASE="https://kemcap.github.io/kemcap-creaid-demos/mayer-zeltwanger/"
          echo "Checking customer-facing page: $BASE"
          curl --retry 8 --retry-all-errors --retry-delay 4 --connect-timeout 15 --max-time 25 -fsSL "$BASE" -o /tmp/mayer-index.html
          grep -Fq "Mayer Zeltwanger" /tmp/mayer-index.html
          grep -Fq "assets/metalldach.webp" /tmp/mayer-index.html
          grep -Fq "assets/fassade.webp" /tmp/mayer-index.html
          grep -Fq "assets/dachentwaesserung.webp" /tmp/mayer-index.html
          grep -Fq "assets/falzdetail.webp" /tmp/mayer-index.html
          for file in leistungen.html kontakt.html assets/styles.css assets/script.js assets/favicon.svg assets/hero.webp assets/metalldach.webp assets/fassade.webp assets/dachentwaesserung.webp assets/falzdetail.webp; do
            echo "Checking $file"
            curl --retry 5 --retry-all-errors --retry-delay 3 --connect-timeout 15 --max-time 25 -fsSL "$BASE$file" -o /dev/null
          done
          curl -fsSL "$BASE/assets/styles.css?v=photo-20261117" -o /tmp/mayer-styles.css
          grep -Fq "hero.webp" /tmp/mayer-styles.css
          curl -fsSL "$BASE/leistungen.html" -o /tmp/mayer-services.html
          grep -Fq "assets/metalldach.webp" /tmp/mayer-services.html
          grep -Fq "assets/falzdetail.webp" /tmp/mayer-services.html
          echo "VERIFIED LIVE: $BASE"
